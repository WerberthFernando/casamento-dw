const BASE_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

const fbGet = async (col, docId) => {
  const r = await fetch(`${BASE_URL}/${col}/${docId}?key=${API_KEY}`);
  if (!r.ok) return null;
  const d = await r.json();
  return d.fields ? JSON.parse(d.fields.data.stringValue) : null;
};

const fbSet = async (col, docId, data) => {
  await fetch(`${BASE_URL}/${col}/${docId}?key=${API_KEY}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({fields: {data: {stringValue: JSON.stringify(data)}}})
  });
};

    {id:70,icon:'🧴',img:'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400&q=80',nome:'Porta-sabonete líquido',desc:'Inox ou cerâmica',status:'livre',reservadoPor:null,msgReserva:null,contribuicoes:[]},
    {id:71,icon:'🪥',img:'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400&q=80',nome:'Porta-escovas',desc:'Inox',status:'livre',reservadoPor:null,msgReserva:null,contribuicoes:[]},
    {id:72,icon:'🧺',img:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&q=80',nome:'Cesto de roupas',desc:'Com tampa',status:'livre',reservadoPor:null,msgReserva:null,contribuicoes:[]},
    {id:79,icon:'🪣',img:'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400&q=80',nome:'Kit Banheiro',desc:'Acessórios completos inox',status:'livre',reservadoPor:null,msgReserva:null,contribuicoes:[]},
  ]},
  {id:'lavanderia',cor:'#0097a7',corBg:'#e0f7fa',icon:'🧺',titulo:'Lavanderia',open:false,itens:[
    {id:73,icon:'👕',img:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&q=80',nome:'Ferro de passar',desc:'A vapor 2400W',status:'livre',reservadoPor:null,msgReserva:null,contribuicoes:[]},
    {id:74,icon:'🪵',img:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&q=80',nome:'Tábua de passar',desc:'Com suporte',status:'livre',reservadoPor:null,msgReserva:null,contribuicoes:[]},
    {id:75,icon:'🌂',img:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&q=80',nome:'Varal',desc:'De chão ou parede',status:'livre',reservadoPor:null,msgReserva:null,contribuicoes:[]},
    {id:76,icon:'🪣',img:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&q=80',nome:'Baldes',desc:'Kit de baldes',status:'livre',reservadoPor:null,msgReserva:null,contribuicoes:[]},
    {id:77,icon:'🧹',img:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&q=80',nome:'Mop',desc:'Com cabo telescópico',status:'livre',reservadoPor:null,msgReserva:null,contribuicoes:[]},
    {id:78,icon:'📦',img:'https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&q=80',nome:'Cestos organizadores',desc:'Para lavanderia',status:'livre',reservadoPor:null,msgReserva:null,contribuicoes:[]},
  ]},
];

const AZUL='#1a4a7a', AZUL_M='#2d6ca8', DOURADO='#c8a96e', AZUL_S='#eef5fc', AZUL_CL='#d6e8f7';

const abas=[
  {id:'presentes',label:'Lista'},
  {id:'reservados',label:'Reservados'},
  {id:'jatemos',label:'Já Temos'},
  {id:'sugestao',label:'Vou Levar'},
  {id:'pix',label:'PIX'},
];

function App(){
  const [ambientes,setAmbientes]=useState(ambientesInicial);
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({nome:'',msg:'',valor:''});
  const [toast,setToast]=useState('');
  const [aba,setAba]=useState('presentes');
  const [jaTemos,setJaTemos]=useState(jaTemosList);
  const [novoItem,setNovoItem]=useState({nome:'',desc:''});
  const [sugestoes,setSugestoes]=useState([]);
  const [sugestaoForm,setSugestaoForm]=useState({nome:'',item:'',obs:''});
  const [contador,setContador]=useState({dias:0,horas:0,minutos:0,segundos:0});
  const [mapaOpen,setMapaOpen]=useState(false);
  const [valorPix,setValorPix]=useState('');
  const [loading,setLoading]=useState(true);
  const conteudoRef=useRef(null);

  // Carregar dados do Firebase
  useEffect(()=>{
    const carregar = async () => {
      try {
        const ambData = await fbGet('dados','ambientes');
        if(ambData) setAmbientes(ambData);
        const sugData = await fbGet('dados','sugestoes');
        if(sugData) setSugestoes(sugData);
        const jtData = await fbGet('dados','jatemos');
        if(jtData) setJaTemos(jtData);
      } catch(e){ console.error('Erro ao carregar:',e); }
      setLoading(false);
    };
    carregar();
    // Polling a cada 15 segundos para atualizar em tempo real
    const interval = setInterval(carregar, 15000);
    return () => clearInterval(interval);
  },[]);

  // Salvar ambientes no Firebase
  const salvarAmbientes = async (novos) => {
    try { await fbSet('dados','ambientes', novos); }
    catch(e){ console.error('Erro ao salvar:',e); }
  };

  // Salvar sugestoes no Firebase
  const salvarSugestoes = async (novas) => {
    try { await fbSet('dados','sugestoes', novas); }
    catch(e){ console.error('Erro ao salvar:',e); }
  };

  // Salvar jaTemos no Firebase
  const salvarJaTemos = async (novos) => {
    try { await fbSet('dados','jatemos', novos); }
    catch(e){ console.error('Erro ao salvar:',e); }
  };

  useEffect(()=>{
    const evento=new Date('2025-11-14T20:00:00');
    const tick=()=>{
      const agora=new Date();
      const diff=evento-agora;
      if(diff<=0){setContador({dias:0,horas:0,minutos:0,segundos:0});return;}
      setContador({
        dias:Math.floor(diff/(1000*60*60*24)),
        horas:Math.floor((diff%(1000*60*60*24))/(1000*60*60)),
        minutos:Math.floor((diff%(1000*60*60))/(1000*60)),
        segundos:Math.floor((diff%(1000*60))/1000),
      });
    };
    tick();
    const t=setInterval(tick,1000);
    return ()=>clearInterval(t);
  },[]);

  const trocarAba=(id)=>{
    setAba(id);
    setTimeout(()=>conteudoRef.current?.scrollIntoView({behavior:'smooth',block:'start'}),50);
  };

  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(''),2800);};
  const todos=ambientes.flatMap(a=>a.itens);
  const ambDe=(id)=>ambientes.find(a=>a.itens.some(i=>i.id===id));
  const encontrar=(id)=>{for(const a of ambientes){const i=a.itens.find(x=>x.id===id);if(i)return i;}return null;};
  const toggleAmb=(id)=>setAmbientes(p=>p.map(a=>a.id===id?{...a,open:!a.open}:a));
  const expandAll=()=>setAmbientes(p=>p.map(a=>({...a,open:true})));
  const collapseAll=()=>setAmbientes(p=>p.map(a=>({...a,open:false})));

  const confirmarDar=()=>{
    if(!form.nome.trim()){showToast('Informe seu nome!');return;}
    const novos=ambientes.map(a=>({...a,itens:a.itens.map(i=>i.id===modal.itemId?{...i,status:'reservado',reservadoPor:form.nome.trim(),msgReserva:form.msg.trim()||null}:i)}));
    setAmbientes(novos);
    salvarAmbientes(novos);
    showToast('🎉 Presente reservado por '+form.nome+'!');
    setModal(null);setForm({nome:'',msg:'',valor:''});
  };

  const confirmarVaq=()=>{
    if(!form.nome.trim()){showToast('Informe seu nome!');return;}
    const valor=extrairNumero(form.valor);
    if(!valor||valor<=0){showToast('Informe um valor!');return;}
    const nome=form.nome.trim();
    const novos=ambientes.map(a=>({...a,itens:a.itens.map(i=>i.id===modal.itemId?{...i,contribuicoes:[...i.contribuicoes,{nome,valor,msg:form.msg.trim()}]}:i)}));
    setAmbientes(novos);
    salvarAmbientes(novos);
    setValorPix(valor);
    setModal(null);setForm({nome:'',msg:'',valor:''});
    setTimeout(()=>{
      trocarAba('pix');
      showToast('💙 Agora finalize seu pagamento via PIX, '+nome+'!');
    },300);
  };

  const formatarMoeda=(valor)=>{
    const num=valor.replace(/\D/g,'');
    if(!num) return '';
    const n=parseInt(num,10)/100;
    return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  };

  const handleValorInput=(e)=>{
    const raw=e.target.value.replace(/\D/g,'');
    const formatado=raw?formatarMoeda(e.target.value):'';
    setForm(p=>({...p,valor:formatado}));
  };

  const setValorFormatado=(v)=>{
    setForm(p=>({...p,valor:`R$ ${v.toFixed(2).replace('.',',')}`}));
  };

  const extrairNumero=(str)=>{
    if(!str) return 0;
    return parseFloat(str.replace(/[^\d,]/g,'').replace(',','.'))||0;
  };

  const adicionarJaTemos=()=>{
    if(!novoItem.nome.trim()){showToast('Informe o nome do item!');return;}
    const novos=[...jaTemos,{id:Date.now(),icon:'✅',nome:novoItem.nome.trim(),desc:novoItem.desc.trim()||'Já temos em casa'}];
    setJaTemos(novos);
    salvarJaTemos(novos);
    setNovoItem({nome:'',desc:''});
    showToast('✅ Item adicionado!');
  };

  const removerJaTemos=(id)=>{
    const novos=jaTemos.filter(i=>i.id!==id);
    setJaTemos(novos);
    salvarJaTemos(novos);
  };

  const confirmarSugestao=()=>{
    if(!sugestaoForm.nome.trim()){showToast('Informe seu nome!');return;}
    if(!sugestaoForm.item.trim()){showToast('Informe o que vai levar!');return;}
    const novas=[...sugestoes,{...sugestaoForm,id:Date.now()}];
    setSugestoes(novas);
    salvarSugestoes(novas);
    setSugestaoForm({nome:'',item:'',obs:''});
    showToast('🎁 Sugestão registrada, obrigado!');
  };

  const stTotal=todos.length;
  const stLivres=todos.filter(i=>i.status!=='reservado').length;
  const stReserv=todos.filter(i=>i.status==='reservado').length;
  const stVaq=todos.filter(i=>i.status!=='reservado'&&i.contribuicoes.length>0).length;
  const modalItem=modal?encontrar(modal.itemId):null;

  if(loading) return(
    <div style={{fontFamily:"'Lato',sans-serif",background:AZUL,minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'#fff'}}>
      <div style={{fontFamily:"'Playfair Display',serif",fontSize:'2rem',marginBottom:'1rem'}}>Werberth <em style={{color:DOURADO}}>&</em> Dayane</div>
      <div style={{width:40,height:40,border:'3px solid rgba(255,255,255,.2)',borderTop:`3px solid ${DOURADO}`,borderRadius:'50%',animation:'spin 1s linear infinite'}}/>
      <p style={{marginTop:'1rem',fontSize:'13px',color:'rgba(255,255,255,.6)',letterSpacing:'2px',textTransform:'uppercase'}}>Carregando...</p>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  return(
    <div style={{fontFamily:"'Lato',sans-serif",background:'#fff',minHeight:'100vh',color:'#4a4a4a'}}>

      {/* NAV */}
      <nav style={{background:AZUL,padding:'.75rem 1.5rem',display:'flex',justifyContent:'center',gap:'1.25rem',position:'sticky',top:0,zIndex:100,flexWrap:'wrap'}}>
        {abas.map(s=>(
          <button key={s.id} onClick={()=>trocarAba(s.id)} style={{background:'none',border:'none',color:aba===s.id?DOURADO:'rgba(255,255,255,.8)',fontSize:'11px',letterSpacing:'1.5px',textTransform:'uppercase',cursor:'pointer',fontWeight:aba===s.id?700:400,fontFamily:'inherit',position:'relative',padding:'0 4px'}}>
            {s.label}
            {s.id==='reservados'&&todos.filter(i=>i.status==='reservado').length>0&&<span style={{position:'absolute',top:-6,right:-10,background:'#e65100',color:'#fff',borderRadius:'50%',width:15,height:15,fontSize:9,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}}>{todos.filter(i=>i.status==='reservado').length}</span>}
            {s.id==='jatemos'&&jaTemos.length>0&&<span style={{position:'absolute',top:-6,right:-10,background:DOURADO,color:'#fff',borderRadius:'50%',width:15,height:15,fontSize:9,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}}>{jaTemos.length}</span>}
            {s.id==='sugestao'&&sugestoes.length>0&&<span style={{position:'absolute',top:-6,right:-10,background:'#2e7d32',color:'#fff',borderRadius:'50%',width:15,height:15,fontSize:9,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}}>{sugestoes.length}</span>}
          </button>
        ))}
      </nav>

      {/* HERO */}
      <div style={{background:AZUL,color:'#fff',textAlign:'center',padding:'3.5rem 1.5rem 3rem'}}>
        <p style={{fontSize:'11px',letterSpacing:'4px',textTransform:'uppercase',color:DOURADO,marginBottom:'.8rem'}}>✦ Chá de Panelas ✦</p>
        <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:'clamp(2rem,5vw,3.5rem)',fontWeight:400,lineHeight:1.1}}>
          Werberth<br/><em style={{fontStyle:'italic',color:DOURADO}}>&</em> Dayane
        </h1>
        <div style={{width:50,height:1,background:DOURADO,margin:'1.25rem auto'}}/>
        <p style={{fontSize:'15px',color:'rgba(255,255,255,.7)',fontWeight:300}}>Venha celebrar conosco este momento tão especial</p>
        <p style={{fontSize:'13px',letterSpacing:'3px',marginTop:'1rem',color:'rgba(255,255,255,.5)'}}>14 · 11 · 2025</p>

        {/* CONTADOR */}
        <div style={{display:'flex',justifyContent:'center',gap:12,marginTop:'2rem',flexWrap:'wrap'}}>
          {[['dias',contador.dias],['horas',contador.horas],['min',contador.minutos],['seg',contador.segundos]].map(([l,v])=>(
            <div key={l} style={{background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.15)',borderRadius:12,padding:'.75rem 1.1rem',minWidth:64,textAlign:'center'}}>
              <div style={{fontSize:'1.8rem',fontWeight:700,color:'#fff',fontFamily:"'Playfair Display',serif",lineHeight:1}}>{String(v).padStart(2,'0')}</div>
              <div style={{fontSize:'10px',letterSpacing:'2px',textTransform:'uppercase',color:DOURADO,marginTop:4}}>{l}</div>
            </div>
          ))}
        </div>

        {/* ENDEREÇO */}
        <button onClick={()=>setMapaOpen(true)} style={{display:'inline-flex',alignItems:'center',gap:8,marginTop:'1.5rem',background:'rgba(255,255,255,.1)',border:'1px solid rgba(255,255,255,.2)',borderRadius:30,padding:'.6rem 1.25rem',color:'rgba(255,255,255,.85)',fontSize:'13px',cursor:'pointer',fontFamily:'inherit'}}>
          <span>📍</span>
          <span>Ponte Alta — Gama, DF</span>
          <span style={{fontSize:'10px',color:DOURADO,letterSpacing:'1px'}}>COMO CHEGAR ›</span>
        </button>

        {/* PALETA DE CORES */}
        <div style={{marginTop:'1.75rem',display:'inline-block',background:'rgba(255,255,255,.06)',border:'1px solid rgba(255,255,255,.12)',borderRadius:16,padding:'1rem 1.5rem'}}>
          <p style={{fontSize:'10px',letterSpacing:'2px',textTransform:'uppercase',color:'rgba(255,255,255,.5)',marginBottom:'.75rem'}}>🎨 Preferimos presentes nessa paleta</p>
          <div style={{display:'flex',justifyContent:'center',alignItems:'center',gap:16}}>
            {[{cor:'#1a1a1a',label:'Preto'},{cor:'#6b6b6b',label:'Cinza'},{cor:'#c0c0c0',label:'Prata'},{cor:'#ffffff',label:'Branco'}].map(({cor,label})=>(
              <div key={cor} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
                <div style={{width:28,height:28,borderRadius:'50%',background:cor,border:cor==='#ffffff'?'2px solid rgba(255,255,255,.4)':'2px solid rgba(255,255,255,.15)',boxShadow:'0 2px 8px rgba(0,0,0,.3)'}}/>
                <span style={{fontSize:'9px',color:'rgba(255,255,255,.45)',letterSpacing:'1px',textTransform:'uppercase'}}>{label}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div ref={conteudoRef} style={{maxWidth:960,margin:'0 auto',padding:'2rem 1.25rem'}}>

        {/* ===== LISTA ===== */}
        {aba==='presentes'&&<>
          <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:'1.7rem',fontWeight:400,color:AZUL,textAlign:'center',marginBottom:'.3rem'}}>Lista de Presentes</h2>
          <p style={{textAlign:'center',color:'#aaa',fontSize:'12px',letterSpacing:'1px',marginBottom:'.5rem'}}>TOQUE NO AMBIENTE PARA VER OS ITENS</p>
          <div style={{width:36,height:1,background:DOURADO,margin:'.5rem auto 1.5rem'}}/>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:'1.5rem'}}>
            {[['Total',stTotal],['Disponíveis',stLivres],['Reservados',stReserv],['Vaquinha',stVaq]].map(([l,v])=>(
              <div key={l} style={{background:'#f7f9fc',borderRadius:10,padding:'.75rem .4rem',textAlign:'center'}}>
                <div style={{fontSize:'1.3rem',fontWeight:700,color:AZUL}}>{v}</div>
                <div style={{fontSize:'10px',color:'#aaa',textTransform:'uppercase',letterSpacing:'.8px',marginTop:2}}>{l}</div>
              </div>
            ))}
          </div>
          <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginBottom:12}}>
            <button onClick={expandAll} style={{background:'none',border:'1.5px solid #ddd',borderRadius:20,padding:'.25rem .8rem',fontSize:'11px',color:'#999',cursor:'pointer',fontFamily:'inherit'}}>Abrir todos</button>
            <button onClick={collapseAll} style={{background:'none',border:'1.5px solid #ddd',borderRadius:20,padding:'.25rem .8rem',fontSize:'11px',color:'#999',cursor:'pointer',fontFamily:'inherit'}}>Fechar todos</button>
          </div>
          {ambientes.map(amb=>{
            const livres=amb.itens.filter(i=>i.status!=='reservado').length;
            return(
              <div key={amb.id} style={{marginBottom:10,borderRadius:14,overflow:'hidden',border:'1.5px solid #e8e8e8'}}>
                <div onClick={()=>toggleAmb(amb.id)} style={{display:'flex',alignItems:'center',gap:10,padding:'.85rem 1rem',cursor:'pointer',background:amb.open?'#f7f7f7':'#fff',borderLeft:`4px solid ${amb.cor}`}}>
                  <span style={{fontSize:'1.2rem'}}>{amb.icon}</span>
                  <span style={{fontFamily:"'Playfair Display',serif",fontSize:'1.05rem',flex:1,color:amb.cor==='#c8a96e'?'#7a5c1e':amb.cor==='#b45309'?'#92400e':amb.cor==='#0097a7'?'#006064':amb.cor}}>{amb.titulo}</span>
                  <span style={{fontSize:'10px',padding:'2px 9px',borderRadius:20,fontWeight:700,background:amb.corBg,color:amb.cor==='#c8a96e'?'#7a5c1e':amb.cor==='#b45309'?'#92400e':amb.cor==='#0097a7'?'#006064':amb.cor,marginRight:8}}>{livres}/{amb.itens.length}</span>
                  <span style={{fontSize:'14px',color:'#bbb',display:'inline-block',transform:amb.open?'rotate(180deg)':'rotate(0)',transition:'transform .3s'}}>⌄</span>
                </div>
                {amb.open&&(
                  <div style={{padding:'.6rem 1rem 1rem'}}>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',gap:8}}>
                      {amb.itens.map(item=>{
                        const res=item.status==='reservado';
                        const temVaq=!res&&item.contribuicoes.length>0;
                        return(
                          <div key={item.id} style={{background:res?'#fafafa':'#fff',border:'1px solid #ebebeb',borderRadius:12,overflow:'hidden'}}>
                            <div style={{height:3,background:amb.cor}}/>
                            {/* FOTO */}
                            <div style={{height:120,background:'#f5f5f5',overflow:'hidden',position:'relative',display:'flex',alignItems:'center',justifyContent:'center'}}>
                              {item.img
                                ? <img src={item.img} alt={item.nome} style={{width:'100%',height:'100%',objectFit:'cover',filter:res?'grayscale(50%)brightness(1.1)':'none'}} onError={e=>{e.target.style.display='none';e.target.nextSibling.style.display='flex';}} />
                                : null}
                              <div style={{display:item.img?'none':'flex',width:'100%',height:'100%',alignItems:'center',justifyContent:'center',fontSize:'2rem'}}>{item.icon}</div>
                              {res&&<div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.35)',display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{background:'#e65100',color:'#fff',borderRadius:20,padding:'4px 12px',fontSize:'10px',fontWeight:700}}>✓ Reservado</span></div>}
                            </div>
                            <div style={{padding:'.7rem .8rem .8rem'}}>
                              <div style={{fontSize:'12px',fontWeight:700,color:AZUL,marginBottom:'.1rem'}}>{item.nome}</div>
                              <div style={{fontSize:'10px',color:'#bbb',marginBottom:'.5rem'}}>{item.desc}</div>
                              {res&&<span style={{display:'inline-flex',fontSize:'9px',fontWeight:700,padding:'2px 7px',borderRadius:20,background:'#fff3e0',color:'#e65100',marginBottom:'.5rem'}}>✓ {item.reservadoPor}</span>}
                              {!res&&temVaq&&<span style={{display:'inline-flex',fontSize:'9px',fontWeight:700,padding:'2px 7px',borderRadius:20,background:'#e3f2fd',color:'#0d47a1',marginBottom:'.5rem'}}>🐄 {item.contribuicoes.length} ajuda(s)</span>}
                              {!res&&!temVaq&&<span style={{display:'inline-flex',fontSize:'9px',fontWeight:700,padding:'2px 7px',borderRadius:20,background:'#e8f5e9',color:'#2e7d32',marginBottom:'.5rem'}}>● Disponível</span>}
                              {res&&item.msgReserva&&<div style={{fontSize:'9px',color:'#555',background:'#f5f7fa',borderRadius:6,padding:'.25rem .5rem',marginBottom:'.4rem',fontStyle:'italic'}}>💬 "{item.msgReserva}"</div>}
                              {res

            </>}
            <label style={{fontSize:'11px',color:'#888',textTransform:'uppercase',letterSpacing:'.7px',display:'block',marginBottom:'.35rem'}}>Mensagem (opcional)</label>
            <textarea value={form.msg} onChange={e=>setForm(p=>({...p,msg:e.target.value}))} placeholder="Ex: Com muito amor! 💙" rows={2} style={{width:'100%',padding:'.65rem .9rem',border:'1.5px solid #e0e0e0',borderRadius:9,fontSize:'13px',fontFamily:'inherit',outline:'none',marginBottom:'.85rem',resize:'none'}}/>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>setModal(null)} style={{flex:1,background:'#f5f5f5',color:'#888',border:'none',borderRadius:9,padding:'.7rem',fontSize:'13px',cursor:'pointer',fontFamily:'inherit'}}>Cancelar</button>
              <button onClick={modal.tipo==='dar'?confirmarDar:confirmarVaq} style={{flex:1,background:AZUL,color:'#fff',border:'none',borderRadius:9,padding:'.7rem',fontSize:'13px',fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>{modal.tipo==='dar'?'Confirmar 🎁':'Confirmar 💙'}</button>
            </div>
          </div>
        </div>
      )}

      {toast&&<div style={{position:'fixed',bottom:'2rem',right:'2rem',background:AZUL,color:'#fff',padding:'.7rem 1.4rem',borderRadius:10,fontSize:'13px',zIndex:999}}>{toast}</div>}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
