const BASE_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

const fbGet = async (col, docId) => {
  const r = await fetch(`${BASE_URL}/${col}/${docId}?key=${API_KEY}`);
  if (!r.ok) return null;
  const d = await r.json();
  return d.fields ? JSON.parse(d.fields.data.stringValue) : null;
};

const fbSet = async (col, docId, data) => {
  await fetch(`${BASE_URL}/${col}/${docId}?key=${API_KEY}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({fields: {data: {stringValue: JSON.stringify(data)}}})
  });
};

  useEffect(()=>{
    const evento=new Date('2026-11-14T20:00:00');

      const agora=new Date();
      const diff=evento-agora;
      if(diff<=0){setContador({dias:0,horas:0,minutos:0,segundos:0});return;}
      setContador({
        dias:Math.floor(diff/(1000*60*60*24)),
        horas:Math.floor((diff%(1000*60*60*24))/(1000*60*60)),
        minutos:Math.floor((diff%(1000*60*60))/(1000*60)),
        segundos:Math.floor((diff%(1000*60))/1000),
      });
    };
    tick();
    const t=setInterval(tick,1000);
    return ()=>clearInterval(t);
  },[]);

  const trocarAba=(id)=>{

  const gerarQRCode=(valor)=>{
    if(!valor||Number(valor)<=0){showToast('Informe um valor!');return;}
    const chave='+5561993677985';
    const nome='WERBERTH FERNANDO';
    const cidade='BRASILIA';
    const valorStr=Number(valor).toFixed(2);

    const f=(id,val)=>{
      const len=String(val.length).padStart(2,'0');
      return id+len+val;
    };

    // Merchant Account Info (ID 26)
    const mai=f('00','br.gov.bcb.pix')+f('01',chave);

    // Additional Data (ID 62)
    const txid='***';
    const addData=f('05',txid);

    // Monta payload sem CRC
    let payload=
      f('00','01')+           // Payload Format Indicator
      f('26',mai)+             // Merchant Account Info
      f('52','0000')+          // Merchant Category Code
      f('53','986')+           // Transaction Currency (BRL)
      f('54',valorStr)+        // Transaction Amount
      f('58','BR')+            // Country Code
      f('59',nome)+            // Merchant Name
      f('60',cidade)+          // Merchant City
      f('62',addData)+         // Additional Data
      '6304';                  // CRC placeholder

    // Calcula CRC16/CCITT
    let crc=0xFFFF;
    for(let i=0;i<payload.length;i++){
      crc^=payload.charCodeAt(i)<<8;
      for(let j=0;j<8;j++){
        crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);
        crc&=0xFFFF;
      }
    }
    payload+=(crc).toString(16).toUpperCase().padStart(4,'0');

    const container=document.getElementById('qrcode-container');
    if(container){
      const url=`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(payload)}&color=1a4a7a&bgcolor=ffffff&margin=10`;
      container.innerHTML=`<img src="${url}" alt="QR Code PIX" style="width:180px;height:180px;border-radius:8px" onload="this.style.opacity=1" style="opacity:0"/>`;
    }
    setPixPayload(payload);
    showToast('✅ QR Code gerado!');
  };

  const expandAll=()=>setAmbientes(p=>p.map(a=>({...a,open:true})));
  const collapseAll=()=>setAmbientes(p=>p.map(a=>({...a,open:false})));

    const novos=ambientes.map(a=>({...a,itens:a.itens.map(i=>i.id===modal.itemId?{...i,status:'reservado',reservadoPor:form.nome.trim(),msgReserva:form.msg.trim()||null}:i)}));

    if(!form.nome.trim()){showToast('Informe seu nome!');return;}
    const valor=extrairNumero(form.valor);

      trocarAba('pix');
      showToast('💙 Agora finalize seu pagamento via PIX, '+nome+'!');

  const formatarMoeda=(valor)=>{
    const num=valor.replace(/\D/g,'');
    if(!num) return '';
    const n=parseInt(num,10)/100;
    return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

  const handleValorInput=(e)=>{
    const raw=e.target.value.replace(/\D/g,'');
    const formatado=raw?formatarMoeda(e.target.value):'';

    setForm(p=>({...p,valor:`R$ ${v.toFixed(2).replace('.',',')}`}));

    if(!novoItem.nome.trim()){showToast('Informe o nome do item!');return;}

    if(!sugestaoForm.nome.trim()){showToast('Informe seu nome!');return;}
    if(!sugestaoForm.item.trim()){showToast('Informe o que vai levar!');return;}
    const novas=[...sugestoes,{...sugestaoForm,id:Date.now()}];

    salvarSugestoes(novas);

              <input value={sugestaoForm.item} onChange={e=>setSugestaoForm(p=>({...p,item:e.target.value}))} placeholder="O que você vai levar?" style={{padding:'.65rem .9rem',border:'1.5px solid #ddd',borderRadius:9,fontSize:'13px',fontFamily:'inherit',outline:'none'}}/>
              <textarea value={sugestaoForm.obs} onChange={e=>setSugestaoForm(p=>({...p,obs:e.target.value}))} placeholder="Observação (cor, tamanho, marca...)" rows={2} style={{padding:'.65rem .9rem',border:'1.5px solid #ddd',borderRadius:9,fontSize:'13px',fontFamily:'inherit',outline:'none',resize:'none'}}/>
              <button onClick={confirmarSugestao} style={{background:AZUL,color:'#fff',border:'none',borderRadius:9,padding:'.7rem',fontSize:'13px',fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>Registrar presente 🎁</button>
            </div>
          </div>
          {sugestoes.length>0&&<>
            <p style={{fontSize:'11px',color:'#aaa',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'.75rem'}}>{sugestoes.length} presente(s) registrado(s)</p>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:10}}>
              {sugestoes.map(s=>(
                <div key={s.id} style={{background:'#fff',border:'1.5px solid #bbf7d0',borderRadius:12,padding:'1rem'}}>
                  <div style={{fontSize:'1.2rem',marginBottom:'.3rem'}}>🎁</div>
                  <div style={{fontSize:'13px',fontWeight:700,color:AZUL,marginBottom:'.1rem'}}>{s.item}</div>
                  {s.obs&&<div style={{fontSize:'11px',color:'#aaa',marginBottom:'.4rem'}}>{s.obs}</div>}
                  <div style={{fontSize:'11px',color:'#15803d',fontWeight:700}}>por {s.nome}</div>
                </div>
              ))}
            </div>
          </>}
        </>}

        {/* ===== LUA DE MEL ===== */}
        {aba==='luademel'&&<>
          <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:'1.7rem',fontWeight:400,color:AZUL,textAlign:'center',marginBottom:'.3rem'}}>🌙 Lua de Mel</h2>
          <p style={{textAlign:'center',color:'#aaa',fontSize:'12px',letterSpacing:'1px',marginBottom:'.5rem'}}>AJUDE A REALIZAR O NOSSO SONHO</p>
          <div style={{width:36,height:1,background:DOURADO,margin:'.5rem auto 1.5rem'}}/>

          {/* Banner divertido */}
          <div style={{background:'linear-gradient(135deg,#1a4a7a,#0d2d52)',borderRadius:16,padding:'2rem 1.5rem',textAlign:'center',marginBottom:'1.5rem',position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',top:10,right:20,fontSize:'3rem',opacity:.15}}>🌙</div>
            <div style={{position:'absolute',bottom:10,left:20,fontSize:'2rem',opacity:.15}}>✈️</div>
            <div style={{fontSize:'2.5rem',marginBottom:'.75rem'}}>🥂🌴✈️</div>
            <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:'1.4rem',color:'#fff',marginBottom:'.75rem'}}>Nos ajude a voar!</h3>
            <p style={{fontSize:'13px',color:'rgba(255,255,255,.75)',lineHeight:1.6,maxWidth:480,margin:'0 auto'}}>
              Já temos o amor garantido, mas a passagem ainda tá no cartão! 😂<br/>
              Se quiser contribuir com nossa lua de mel, qualquer valor é recebido com muito carinho — e uma dança de samba na chegada! 🕺💃
            </p>
          </div>

          {/* Cards de valor */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:12,marginBottom:'1.5rem'}}>
            {[
              {emoji:'☕',titulo:'Um cafezinho lá',valor:50,desc:'Já ajuda a pagar o café da manhã no hotel!'},
              {emoji:'🍽️',titulo:'Um jantar romântico',valor:150,desc:'Uma jantinha especial pra gente lá!'},
              {emoji:'🎡',titulo:'Um passeio',valor:300,desc:'Ajuda a pagar um passeio incrível!'},
              {emoji:'🛏️',titulo:'Uma diária',valor:500,desc:'Uma noite no hotel dos sonhos!'},
              {emoji:'✈️',titulo:'Parte da passagem',valor:800,desc:'Já ajuda muito na passagem de avião!'},
              {emoji:'🌴',titulo:'Surpreenda!',valor:null,desc:'Contribua com o valor que quiser do coração!'},
            ].map((item,i)=>(
              <div key={i} style={{background:'#fff',border:'1.5px solid #e8e8e8',borderRadius:14,padding:'1.25rem 1rem',textAlign:'center',cursor:'pointer',transition:'all .2s'}}
                onClick={()=>{trocarAba('pix');setTimeout(()=>{if(item.valor)setValorPix(item.valor);},300);}}>
                <div style={{fontSize:'2rem',marginBottom:'.5rem'}}>{item.emoji}</div>
                <div style={{fontSize:'13px',fontWeight:700,color:AZUL,marginBottom:'.25rem'}}>{item.titulo}</div>
                {item.valor&&<div style={{fontSize:'1.2rem',fontWeight:700,color:DOURADO,marginBottom:'.4rem'}}>R$ {item.valor}</div>}
                <div style={{fontSize:'11px',color:'#aaa',lineHeight:1.4,marginBottom:'.75rem'}}>{item.desc}</div>
                <button style={{width:'100%',background:AZUL,color:'#fff',border:'none',borderRadius:8,padding:'.5rem',fontSize:'12px',fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
                  💙 Contribuir {item.valor?`R$ ${item.valor}`:'com outro valor'}
                </button>
              </div>
            ))}
          </div>

          <div style={{background:AZUL_S,borderRadius:12,padding:'1rem 1.25rem',textAlign:'center',fontSize:'13px',color:'#555'}}>
            💡 Ao clicar em contribuir você será levado para o PIX com o valor já preenchido!
          </div>
        </>}

        {/* ===== PIX ===== */}
        {aba==='pix'&&<>
          <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:'1.7rem',fontWeight:400,color:AZUL,textAlign:'center',marginBottom:'.3rem'}}>Contribuição em Dinheiro</h2>
          <p style={{textAlign:'center',color:'#aaa',fontSize:'12px',letterSpacing:'1px',marginBottom:'.5rem'}}>SUA AJUDA FAZ PARTE DO NOSSO SONHO</p>
          <div style={{width:36,height:1,background:DOURADO,margin:'.5rem auto 1.5rem'}}/>
          <div style={{background:AZUL_S,borderRadius:20,padding:'2rem',display:'flex',flexWrap:'wrap',gap:'1.5rem',justifyContent:'center',alignItems:'flex-start'}}>
            {valorPix>0&&(
              <div style={{width:'100%',background:'#e8f5e9',border:'1.5px solid #81c784',borderRadius:12,padding:'1rem 1.25rem',display:'flex',alignItems:'center',gap:12,marginBottom:'.5rem'}}>
                <span style={{fontSize:'1.5rem'}}>✅</span>
                <div>
                  <div style={{fontSize:'13px',fontWeight:700,color:'#2e7d32',marginBottom:'.15rem'}}>Contribuição registrada!</div>
                  <div style={{fontSize:'12px',color:'#388e3c'}}>Valor: <strong>R$ {Number(valorPix).toFixed(2).replace('.',',')}</strong> — Escaneie o QR Code abaixo para finalizar.</div>
                </div>
              </div>
            )}
            <div style={{background:'#fff',borderRadius:14,padding:'1rem',border:'1px solid #e0e0e0',textAlign:'center'}}>
              <div id="qrcode-container" style={{width:180,height:180,display:'flex',alignItems:'center',justifyContent:'center'}}>
                <div style={{color:'#aaa',fontSize:'12px',textAlign:'center'}}>
                  <div style={{fontSize:'2rem',marginBottom:8}}>📱</div>
                  <div>Digite um valor e<br/>clique em Gerar QR Code</div>
                </div>
              </div>
              <p style={{fontSize:'11px',color:'#aaa',marginTop:'.5rem'}}>Escaneie com qualquer banco</p>
            </div>
            <div style={{textAlign:'left',maxWidth:280}}>
              <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:'1.2rem',color:AZUL,marginBottom:'.85rem'}}>PIX rápido e fácil 💙</h3>
              <div style={{background:'#fff',border:'1px solid #ddd',borderRadius:10,padding:'.85rem 1rem',display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,marginBottom:'.85rem'}}>
                <div>
                  <div style={{fontSize:'10px',color:'#aaa',textTransform:'uppercase',letterSpacing:'1px'}}>Chave PIX</div>
                  <div style={{fontSize:'14px',fontWeight:700,color:AZUL}}>(61) 99367-7985</div>
                </div>
                <button onClick={()=>navigator.clipboard.writeText('61993677985').then(()=>showToast('✓ Chave copiada!'))} style={{background:AZUL,color:'#fff',border:'none',borderRadius:8,padding:'.4rem .85rem',fontSize:'11px',cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}}>Copiar</button>
              </div>
              <div style={{fontSize:'11px',color:'#aaa',textTransform:'uppercase',letterSpacing:'.8px',marginBottom:'.35rem'}}>Valor</div>
              <input type="number" value={valorPix||''} onChange={e=>setValorPix(e.target.value)} placeholder="R$ 0,00" min="1" style={{width:'100%',padding:'.6rem .85rem',border:`1.5px solid ${valorPix?'#81c784':'#ddd'}`,borderRadius:10,fontSize:'1rem',fontWeight:700,color:AZUL,fontFamily:'inherit',outline:'none',marginBottom:'.6rem',background:valorPix?'#f0fdf4':'#fff'}}/>
              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:'.7rem'}}>
                {[50,100,200,300].map(v=>(
                  <button key={v} onClick={()=>setValorPix(v)} style={{background:'#fff',border:`1.5px solid ${AZUL_CL}`,color:AZUL,borderRadius:20,padding:'.28rem .75rem',fontSize:'12px',cursor:'pointer',fontFamily:'inherit'}}>R$ {v}</button>
                ))}
              </div>
              <button onClick={()=>gerarQRCode(valorPix)} style={{width:'100%',background:AZUL,color:'#fff',border:'none',borderRadius:10,padding:'.75rem',fontSize:'13px',fontWeight:700,cursor:'pointer',fontFamily:'inherit',marginBottom:8}}>Gerar QR Code ✦</button>
              {pixPayload&&(
                <button
                  onClick={()=>navigator.clipboard.writeText(pixPayload).then(()=>showToast('✓ Código PIX copiado! Cole no seu banco.'))}
                  style={{width:'100%',background:'#fff',color:AZUL,border:`1.5px solid ${AZUL_CL}`,borderRadius:10,padding:'.75rem',fontSize:'13px',fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}
                >
                  📋 Copiar código PIX (Copia e Cola)
                </button>
              )}
            </div>
          </div>
        </>}
      </div>

      {/* RODAPÉ */}
      <div style={{background:AZUL,color:'#fff',textAlign:'center',padding:'2rem 1.5rem',marginTop:'1rem'}}>
        <p style={{fontFamily:"'Playfair Display',serif",fontStyle:'italic',fontSize:'1.15rem',color:'rgba(255,255,255,.85)',maxWidth:480,margin:'0 auto .9rem'}}>"A vida a dois começa com pequenos gestos de amor. Obrigado por fazer parte desta história."</p>
        <div style={{fontSize:'12px',color:DOURADO,letterSpacing:'2px',textTransform:'uppercase'}}>Werberth & Dayane · 14.11.2026</div>
      </div>
      <footer style={{textAlign:'center',padding:'1rem',fontSize:'11px',color:'#bbb',background:'#f9f9f9'}}>Desenvolvido por Werberth · Lista de Presentes W&D 2026</footer>

      {/* MODAL MAPA */}
      {mapaOpen&&(
        <div onClick={()=>setMapaOpen(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:200,display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
          <div onClick={e=>e.stopPropagation()} style={{background:'#fff',borderRadius:'18px 18px 0 0',padding:'1.5rem 1.5rem 2rem',width:'100%',maxWidth:480}}>
            <div style={{width:36,height:4,background:'#ddd',borderRadius:2,margin:'0 auto 1.25rem'}}/>
            <p style={{fontFamily:"'Playfair Display',serif",fontSize:'1.1rem',color:AZUL,marginBottom:'.3rem',textAlign:'center'}}>📍 Como você quer chegar?</p>
            <p style={{fontSize:'12px',color:'#aaa',textAlign:'center',marginBottom:'1.25rem'}}>Ponte Alta — Gama, DF</p>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {[
                {nome:'Google Maps',icon:'🗺️',url:'https://maps.google.com/?q=Ponte+Alta,+Gama,+DF'},
                {nome:'Waze',icon:'🚗',url:'https://waze.com/ul?q=Ponte+Alta,+Gama,+DF&navigate=yes'},
                {nome:'Apple Maps',icon:'🍎',url:'https://maps.apple.com/?q=Ponte+Alta,+Gama,+DF'},
                {nome:'Moovit',icon:'🚌',url:'https://moovitapp.com/index/pt-br/dire%C3%A7%C3%B5es?destinationName=Ponte+Alta+Gama+DF'},
              ].map(app=>(
                <a key={app.nome} href={app.url} target="_blank" rel="noopener noreferrer" onClick={()=>setMapaOpen(false)}
                  style={{display:'flex',alignItems:'center',gap:14,padding:'1rem 1.25rem',border:'1.5px solid #eee',borderRadius:12,textDecoration:'none',color:'#333',background:'#fafafa'}}>
                  <span style={{fontSize:'1.5rem'}}>{app.icon}</span>
                  <div>
                    <div style={{fontSize:'14px',fontWeight:700,color:AZUL}}>{app.nome}</div>
                    <div style={{fontSize:'11px',color:'#aaa'}}>Abrir no {app.nome}</div>
                  </div>
                  <span style={{marginLeft:'auto',color:'#ccc',fontSize:'16px'}}>›</span>
                </a>
              ))}
            </div>
            <button onClick={()=>setMapaOpen(false)} style={{width:'100%',marginTop:'1rem',background:'#f5f5f5',color:'#888',border:'none',borderRadius:10,padding:'.75rem',fontSize:'13px',cursor:'pointer',fontFamily:'inherit'}}>Cancelar</button>
          </div>
        </div>
      )}

      {/* MODAL PRESENTE/VAQUINHA */}
      {modal&&modalItem&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div style={{background:'#fff',borderRadius:18,padding:'1.75rem',maxWidth:400,width:'92%',position:'relative',maxHeight:'90vh',overflowY:'auto'}}>
            <button onClick={()=>setModal(null)} style={{position:'absolute',top:'.9rem',right:'.9rem',background:'none',border:'none',fontSize:'1.1rem',cursor:'pointer',color:'#bbb'}}>✕</button>
            <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:'1.2rem',color:AZUL,marginBottom:'.3rem'}}>{modal.tipo==='dar'?'🎁':'🐄'} {modalItem.nome}</h3>
            <p style={{fontSize:'12px',color:'#aaa',marginBottom:'1rem'}}>{modal.tipo==='dar'?'Preencha seus dados para reservar este presente':'Contribua com qualquer valor para ajudar'}</p>
            <label style={{fontSize:'11px',color:'#888',textTransform:'uppercase',letterSpacing:'.7px',display:'block',marginBottom:'.35rem'}}>Seu nome</label>
            <input value={form.nome} onChange={e=>setForm(p=>({...p,nome:e.target.value}))} placeholder="Como você se chama?" style={{width:'100%',padding:'.65rem .9rem',border:'1.5px solid #e0e0e0',borderRadius:9,fontSize:'13px',fontFamily:'inherit',outline:'none',marginBottom:'.85rem'}}/>
            {modal.tipo==='vaq'&&<>
              <label style={{fontSize:'11px',color:'#888',textTransform:'uppercase',letterSpacing:'.7px',display:'block',marginBottom:'.35rem'}}>Valor</label>
              <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:'.75rem'}}>
                {[50,100,150,200].map(v=><button key={v} onClick={()=>setValorFormatado(v)} style={{background:'#f0f4fa',color:AZUL,border:'none',borderRadius:16,padding:'.28rem .75rem',fontSize:'11px',cursor:'pointer',fontFamily:'inherit'}}>R$ {v}</button>)}
              </div>
              <input type="text" inputMode="numeric" value={form.valor} onChange={handleValorInput} placeholder="R$ 0,00" style={{width:'100%',padding:'.65rem .9rem',border:'1.5px solid #e0e0e0',borderRadius:9,fontSize:'15px',fontWeight:700,color:AZUL,fontFamily:'inherit',outline:'none',marginBottom:'.85rem'}}/>
            </>}
            <label style={{fontSize:'11px',color:'#888',textTransform:'uppercase',letterSpacing:'.7px',display:'block',marginBottom:'.35rem'}}>Mensagem (opcional)</label>
            <textarea value={form.msg} onChange={e=>setForm(p=>({...p,msg:e.target.value}))} placeholder="Ex: Com muito amor! 💙" rows={2} style={{width:'100%',padding:'.65rem .9rem',border:'1.5px solid #e0e0e0',borderRadius:9,fontSize:'13px',fontFamily:'inherit',outline:'none',marginBottom:'.85rem',resize:'none'}}/>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>setModal(null)} style={{flex:1,background:'#f5f5f5',color:'#888',border:'none',borderRadius:9,padding:'.7rem',fontSize:'13px',cursor:'pointer',fontFamily:'inherit'}}>Cancelar</button>
              <button onClick={modal.tipo==='dar'?confirmarDar:confirmarVaq} style={{flex:1,background:AZUL,color:'#fff',border:'none',borderRadius:9,padding:'.7rem',fontSize:'13px',fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>{modal.tipo==='dar'?'Confirmar 🎁':'Confirmar 💙'}</button>
            </div>
          </div>
        </div>
      )}

      {toast&&<div style={{position:'fixed',bottom:'2rem',right:'2rem',background:AZUL,color:'#fff',padding:'.7rem 1.4rem',borderRadius:10,fontSize:'13px',zIndex:999}}>{toast}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
